
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project1-frontend
  namespace: argocd
spec:
  project: project-1
  source:
    repoURL: 'https://github.com/<your-username>/Project-1-Group-9.git'
    targetRevision: HEAD
    path: deploy/frontend
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
