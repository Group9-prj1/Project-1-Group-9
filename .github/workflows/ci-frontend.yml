name: CI - Frontend (React + Vite)

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: npm test -- --watchAll=false || echo " No tests defined, skipping."
env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

