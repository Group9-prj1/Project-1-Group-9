name: CI - Test & Build

on:
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run tests
        working-directory: ./backend
        run: |
          # Add your test commands here
          # Example: pytest tests/
          echo "Tests passed!"
      
      - name: Lint code
        working-directory: ./backend
        run: |
          pip install flake8
          flake8 app/ --max-line-length=120 --exclude=__pycache__,migrations || true

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test-backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        working-directory: ./backend
        run: |
          docker build -t backend-test:${{ github.sha }} .
      
      - name: Test Docker image
        working-directory: ./backend
        run: |
          docker run --rm backend-test:${{ github.sha }} python -c "print('Docker image OK')"

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Build frontend
        working-directory: ./frontend
        env:
          VITE_API_BASE: http://localhost:8000
          VITE_FRONT_HOME: http://localhost:5173
        run: npm run build
      
      - name: Check build output
        working-directory: ./frontend
        run: |
          ls -la dist/
          echo "Frontend build successful!"
