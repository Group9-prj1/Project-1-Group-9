# File: docker-compose.yml
version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: project_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: summarizer_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  backend:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    environment:
      # KẾT NỐI DB NỘI BỘ VÀ TRUYỀN SECRETS
      DATABASE_URL: postgresql://project_user:${DB_PASSWORD}@db:5432/summarizer_db
      SECRET_KEY: ${APP_SECRET_KEY}
      FRONTEND_ORIGIN: http://${PUBLIC_IP}:3000
      
      # CẤU HÌNH OAUTH VÀ LLM
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: http://${PUBLIC_IP}:8000/auth/google/callback
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URI: http://${PUBLIC_IP}:8000/auth/github/callback
      URL_PREDICT: ${URL_PREDICT} 
      
    ports:
      - "8000:8000" 
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      # Truyền API URL nội bộ vào giai đoạn build
      args:
        VITE_API_URL: http://backend:8000 
    restart: always
    ports:
      - "3000:80" 
    depends_on:
      - backend

volumes:
  postgres_data:
